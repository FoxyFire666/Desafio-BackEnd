version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: desafio
      POSTGRES_USER: desafio
      POSTGRES_PASSWORD: desafio
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  localstack:
    image: localstack/localstack:3.8
    environment:
      SERVICES: sqs
      SQS_ENDPOINT_STRATEGY: standard
    ports:
      - "4566:4566"
    volumes:
      - localstack_data:/var/lib/localstack

  api:
    build: .
    depends_on:
      - postgres
      - localstack
    environment:
      HTTP_ADDR: :8080
      POSTGRES_DSN: postgres://desafio:desafio@postgres:5432/desafio?sslmode=disable
      SQS_QUEUE_URL: http://localstack:4566/000000000000/wager-transactions.fifo
      USE_STUB_AUTH: "true"
    ports:
      - "8080:8080"

volumes:
  postgres_data:
  localstack_data:
